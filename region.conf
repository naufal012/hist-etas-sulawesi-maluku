# =====================================================================
#  HIST-ETAS run definition -- Sulawesi / Maluku
#  Single source of truth. Every stage config is GENERATED from this
#  file by scripts/gen_configs.py; do not hand-edit the generated
#  run/sNN/*.conf files, they are overwritten on each run.
# =====================================================================

NAME        = sulawesi-maluku

# ---- region box -----------------------------------------------------
# Region spans XMIN..XMIN+TX degrees E and YMIN..YMIN+TY degrees N.
# YMIN is negative here (southern hemisphere) -- this is fine: delone1
# subtracts YMIN internally, and the cos-latitude correction in the
# HIST-ETAS programs uses cos(YMIN+TY/2), which is symmetric about 0.
XMIN        = 118.0        # western edge, degrees E
YMIN        = -6.0         # southern edge, degrees N (negative = south)
TX          = 14.0         # width,  degrees  -> 118..132 E
TY          = 12.0         # height, degrees  ->  -6..+6  N

# ---- time window ----------------------------------------------------
# CATALOG_START/END describe the fetched catalogue. TSTART is the
# precursory span in days: events before it are used only as history
# H_t for the triggering sums, not as target events.
CATALOG_START = 2000-01-01
CATALOG_END   = 2026-06-30
TSTART        = 730.0      # days of precursory history -> target from 2002-01-01

# ---- magnitudes -----------------------------------------------------
# MC is the completeness magnitude and the ETAS target threshold.
# CLMS selects mainshocks for the anisotropic cluster analysis.
# XMG0 is the reference magnitude M0 in exp(alpha*(M-M0)); keeping it
# equal to MC makes the productivity K0 directly interpretable.
# The delo2d stages use MC-0.05 (Utsu's correction for 0.1-rounded
# magnitudes) -- gen_configs.py derives that, do not set it here.
MC          = 6.0
CLMS        = 6.5
XMG0        = 6.0

# ---- model / numerics ----------------------------------------------
ZMIN        = 0.0          # minimum time in days (NOT a depth floor --
                           # the package name is misleading; see manual 4.2).
BI2         = 2.0          # triggering range = BI2 x Utsu spatial distance
DELO_W1     = 6.0d0        # initial smoothness weight for the delo2d stages

# Initial theta = (mu, K0, c, alpha, p, d, q) for st-etas. These are the
# package's defaults, which are reasonable generic starting values for an
# M>=6 target set. If st-etas fails to converge, perturb these first.
THETA0      = 0.95428E-06 0.40231E-02 0.12529E-02 0.11723E+01 0.94533E+00 0.11215E-04 0.13821E+01

# ---- catalogue source ----------------------------------------------
# Used only by scripts/fetch_catalog.py. Swap in a BMKG export by
# replacing catalog/usgs-raw.csv and re-running make_hypo.py.
FETCH_MINMAG = 4.5         # fetch below MC: etas2aniso needs sub-threshold
                           # aftershocks to estimate cluster anisotropy S_j

# ---- stage 13: intensity evaluation ---------------------------------
# Grid for node.f and interp5pa.f. 210 x 180 over a 14 x 12 degree box is
# 0.0667 deg square, so pixels are square in degrees and the maps are not
# resampled anisotropically.
NODE_NX     = 210
NODE_NY     = 180
# NODE_BOX  = lon1 lon2 lat1 lat2   # optional zoom; default is the region box

# Instants at which to evaluate the conditional intensity, as
#   DAY:TAG:LABEL  separated by commas, DAY measured in days from the first
# event of the catalogue (the same axis as column 5 of work.etas). These
# bracket the M7.8 of 2026-06-06, which falls at day 9653.45.
# Nothing after DAY may contain a comma or a colon.
SNAPSHOTS   = 9653.0:pre:2026-06-05 before the M7.8,9654.45:d1:2026-06-07 one day after the M7.8,9675.0:end:2026-06-29 end of target period
